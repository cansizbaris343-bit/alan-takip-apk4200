<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alan Takip</title>
<style>
:root{
  --bg:#14171a; --panel:#1c2126; --panel2:#20262c; --line:#2a3138;
  --text:#e8ecef; --dim:#8a949e; --accent:#c7f284; --warn:#ffb454; --hot:#ff5f5f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f4f1; --panel:#ffffff; --panel2:#eef1ec; --line:#dbe0da;
    --text:#1c2126; --dim:#5b6570; --accent:#4c7a2e; --warn:#a86a12; --hot:#c0392b;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{
  margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;
}
header{
  padding:14px 16px calc(10px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px;}
#btConn{
  background:var(--panel2);color:var(--text);border:1px solid var(--line);
  padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;
}
#btConn.on{background:var(--accent);color:#14171a;border-color:var(--accent);}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
.readout{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
.readout .val{font-size:38px;font-variant-numeric:tabular-nums;font-weight:700;}
.readout .unit{color:var(--dim);font-size:13px;}
.bar{height:14px;background:var(--panel2);border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.bar > div{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--warn));transition:width .15s ease;}
.hint{color:var(--dim);font-size:12px;margin-top:8px;}
.gridwrap{display:flex;flex-direction:column;gap:10px;}
.gridtitle{display:flex;justify-content:space-between;align-items:center;}
.gridtitle span{font-size:13px;color:var(--dim);}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.cell{
  aspect-ratio:1;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);position:relative;
}
.cell.current{border:2px solid var(--accent);}
.cell .v{position:absolute;bottom:3px;right:5px;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;}
.modewrap{display:flex;flex-direction:column;gap:8px;}
.modetitle{font-size:13px;color:var(--dim);font-weight:600;}
.modebtns{display:flex;gap:8px;}
.modebtn{
  flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);font-size:13px;font-weight:600;
}
.modebtn.active{background:var(--accent);color:#14171a;border-color:var(--accent);}
.cell.stake{outline:2px solid var(--warn);outline-offset:-2px;}
.actions{display:flex;gap:10px;flex-wrap:wrap;}
.actions .act{flex:1 1 30%;}
button.act{
  flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);font-size:14px;font-weight:600;
}
button.act.primary{background:var(--accent);color:#14171a;border-color:var(--accent);}
button.act.reset{color:var(--hot);}
footer{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));color:var(--dim);font-size:11px;text-align:center;}
</style>
</head>
<body>
<header>
  <h1>Alan Takip</h1>
  <button id="btConn">Bağlan</button>
</header>
<main>
  <div class="card">
    <div class="readout">
      <div class="val" id="valNum">0</div>
      <div class="unit">sinyal gücü</div>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="hint" id="statusHint">Bağlantı bekleniyor — bağlanınca canlı sinyal burada görünür.</div>
  </div>

  <div class="card modewrap">
    <div class="modetitle">Mod</div>
    <div class="modebtns">
      <button class="modebtn active" id="modeObj">🎯 Nesne Arama</button>
      <button class="modebtn" id="modeVoid">🕳️ Boşluk Arama</button>
    </div>
    <div class="hint" id="modeHint">Sıcak renk = güçlü sinyal, aranan nesneye yakın.</div>
  </div>

  <div class="card gridwrap">
    <div class="gridtitle">
      <span id="gridInstr">Karo seç, o noktadaki değeri kaydet</span>
      <span id="curCellLabel">seçili: —</span>
    </div>
    <div id="grid"></div>
    <div class="actions">
      <button class="act primary" id="btRecord">Bu karoya kaydet</button>
      <button class="act" id="btStake">📍 Kazık burada</button>
      <button class="act reset" id="btReset">Sıfırla</button>
    </div>
  </div>
</main>
<footer>Veri, harici Bluetooth ünitesinden gelir · yerel olarak bu telefonda saklanır</footer>
<script>
const GRID=6;
let cells=Array(GRID*GRID).fill(null);
let current=-1;
let stakeIdx=-1;
let mode='obj'; // 'obj' | 'void'
let liveValue=0;
let device=null, char=null;

const gridEl=document.getElementById('grid');
const valNum=document.getElementById('valNum');
const barFill=document.getElementById('barFill');
const statusHint=document.getElementById('statusHint');
const curCellLabel=document.getElementById('curCellLabel');
const btConn=document.getElementById('btConn');
const modeHint=document.getElementById('modeHint');
const gridInstr=document.getElementById('gridInstr');

function loadSaved(){
  try{
    const raw=localStorage.getItem('alanTakipGrid');
    if(raw){ const p=JSON.parse(raw); cells=p.cells||p; stakeIdx = (p.stakeIdx!==undefined)?p.stakeIdx:-1; }
  }catch(e){}
}
function saveGrid(){
  try{ localStorage.setItem('alanTakipGrid', JSON.stringify({cells, stakeIdx})); }catch(e){}
}
function rc(i){ return { r: Math.floor(i/GRID), c: i%GRID }; }
function dist(i,j){
  const a=rc(i), b=rc(j);
  return Math.round(Math.hypot(a.r-b.r, a.c-b.c));
}
// Halka (ring) normalizasyonu: her hücreyi kazığa uzaklığına göre grupla,
// grup ortalamasından ne kadar saptığını hesapla.
function computeAnomalies(){
  if(stakeIdx<0) return Array(cells.length).fill(null);
  const groups={};
  cells.forEach((v,i)=>{
    if(v===null || i===stakeIdx) return;
    const d=dist(i,stakeIdx);
    (groups[d]=groups[d]||[]).push(v);
  });
  const ringAvg={};
  Object.keys(groups).forEach(d=>{
    const arr=groups[d];
    ringAvg[d]=arr.reduce((a,b)=>a+b,0)/arr.length;
  });
  return cells.map((v,i)=>{
    if(v===null || i===stakeIdx) return null;
    const d=dist(i,stakeIdx);
    return ringAvg[d]-v; // pozitif = kendi halkasına göre zayıf = anomali adayı
  });
}
function colorFor(v){
  if(v===null) return null;
  const t=Math.max(0,Math.min(1,v/100));
  // blend panel2 -> accent -> hot
  if(t<0.5){
    return mix('#20262c','#c7f284', t/0.5);
  }else{
    return mix('#c7f284','#ff5f5f', (t-0.5)/0.5);
  }
}
function mix(a,b,t){
  const pa=hexToRgb(a), pb=hexToRgb(b);
  const r=Math.round(pa.r+(pb.r-pa.r)*t);
  const g=Math.round(pa.g+(pb.g-pa.g)*t);
  const bl=Math.round(pa.b+(pb.b-pa.b)*t);
  return `rgb(${r},${g},${bl})`;
}
function hexToRgb(h){
  h=h.replace('#','');
  return {r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)};
}
function colorForAnomaly(score, maxScore){
  if(score===null) return null;
  if(score<=0) return '#20262c'; // beklenenden zayıf değil -> nötr
  const t=Math.max(0,Math.min(1, maxScore>0 ? score/maxScore : 0));
  return mix('#20262c','#5aa9ff', t); // mavi = boşluk/anomali şiddeti
}
function renderGrid(){
  gridEl.innerHTML='';
  let anomalies=null, maxScore=0;
  if(mode==='void'){
    anomalies=computeAnomalies();
    anomalies.forEach(a=>{ if(a!==null && a>maxScore) maxScore=a; });
  }
  cells.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className='cell'+(i===current?' current':'')+(i===stakeIdx?' stake':'');
    if(mode==='obj'){
      if(v!==null){
        d.style.background=colorFor(v);
        const s=document.createElement('div');
        s.className='v'; s.textContent=Math.round(v);
        d.appendChild(s);
      }
    }else{
      const a=anomalies?anomalies[i]:null;
      if(a!==null){
        d.style.background=colorForAnomaly(a,maxScore);
        const s=document.createElement('div');
        s.className='v'; s.textContent=a>0?('-'+Math.round(a)):'0';
        d.appendChild(s);
      }
    }
    d.onclick=()=>{ current=i; curCellLabel.textContent='seçili: '+(i+1); renderGrid(); };
    gridEl.appendChild(d);
  });
}
function updateReadout(v){
  liveValue=v;
  valNum.textContent=Math.round(v);
  barFill.style.width=Math.max(0,Math.min(100,v))+'%';
}

document.getElementById('btRecord').onclick=()=>{
  if(current<0){ statusHint.textContent='Önce bir karo seç.'; return; }
  cells[current]=liveValue;
  saveGrid();
  renderGrid();
};
document.getElementById('btReset').onclick=()=>{
  cells=Array(GRID*GRID).fill(null);
  current=-1; stakeIdx=-1;
  curCellLabel.textContent='seçili: —';
  saveGrid();
  renderGrid();
};
document.getElementById('btStake').onclick=()=>{
  if(current<0){ statusHint.textContent='Önce kazığın durduğu karoyu seç.'; return; }
  stakeIdx=current;
  saveGrid();
  renderGrid();
};
const modeObjBtn=document.getElementById('modeObj');
const modeVoidBtn=document.getElementById('modeVoid');
modeObjBtn.onclick=()=>{
  mode='obj';
  modeObjBtn.classList.add('active'); modeVoidBtn.classList.remove('active');
  modeHint.textContent='Sıcak renk = güçlü sinyal, aranan nesneye yakın.';
  gridInstr.textContent='Karo seç, o noktadaki değeri kaydet';
  renderGrid();
};
modeVoidBtn.onclick=()=>{
  mode='void';
  modeVoidBtn.classList.add('active'); modeObjBtn.classList.remove('active');
  modeHint.textContent='Mavi = aynı uzaklıktaki karolara göre beklenenden zayıf sinyal (olası boşluk/gevşek toprak). Önce kazık konumunu işaretle.';
  gridInstr.textContent='Karo seç ve kaydet — kazık konumuna göre karşılaştırılır';
  renderGrid();
};

async function connectBLE(){
  if(!navigator.bluetooth){
    statusHint.textContent='Bu tarayıcı Bluetooth desteklemiyor (Android/Chrome gerekli).';
    return;
  }
  try{
    device=await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:['0000ffe0-0000-1000-8000-00805f9b34fb']
    });
    const server=await device.gatt.connect();
    statusHint.textContent='Bağlandı: '+(device.name||'cihaz');
    btConn.textContent='Bağlı';
    btConn.classList.add('on');
    try{
      const service=await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
      char=await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
      await char.startNotifications();
      char.addEventListener('characteristicvaluechanged', e=>{
        const v=e.target.value.getUint8(0);
        updateReadout(v);
      });
    }catch(e){
      statusHint.textContent='Bağlandı ama veri servisi bulunamadı — ünite servis UUID\'sini kontrol et.';
    }
    device.addEventListener('gattserverdisconnected', ()=>{
      btConn.textContent='Bağlan'; btConn.classList.remove('on');
      statusHint.textContent='Bağlantı kesildi.';
    });
  }catch(e){
    statusHint.textContent='Bağlanamadı: '+e.message;
  }
}
btConn.onclick=()=>{
  if(device && device.gatt.connected){ device.gatt.disconnect(); }
  else{ connectBLE(); }
};

loadSaved();
renderGrid();
</script>
</body>
</html>
